name: Publish image

# GitHub-hosted runners build the image. They have no AWS credentials.
# ecr-public-publisher pushes it. That runner is a repo-scoped ARC runner
# whose pod has an IAM role (IRSA or pod identity). There are no AWS keys
# in GitHub secrets.
#
# That runner's jobs are allowlisted to push of main, v* tags, schedule, and
# workflow_dispatch, and only when this repository is not a fork. pull_request
# and pull_request_target never select it. Fork pull requests can still change
# a workflow file, so Actions must keep requiring approval before running
# workflows from outside collaborators.
#
# Platforms are linux/amd64 and linux/arm64. Ubuntu 26.04 also publishes
# linux/arm/v7 (and not linux/386), but AWS CLI v2 ships installers only for
# x86_64 and aarch64, and the Dockerfile rejects every other TARGETARCH.
#
# ecr-public-publisher is assumed to have docker and aws CLI v2, plus curl,
# tar, and sha256sum so the push job can install pinned crane and cosign
# binaries.
# It is not assumed to have sudo, skopeo, crane, cosign, or jq. The Actions
# runner must be new enough for Node 24 actions (runner 2.327.1 or newer):
# checkout and download-artifact both run on node24.
#
# ECR Public API calls use us-east-1, the only region that serves them.
# public.ecr.aws/grasshopper/aws-kubectl must already exist. This workflow
# does not create the repository.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild: reinstalls the added packages from the current Ubuntu
    # archive and fetches current kubectl and AWS CLI. The pinned base digest
    # moves only by pull request.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: public.ecr.aws/grasshopper/aws-kubectl
  ECR_REPOSITORY: aws-kubectl
  ECR_REGION: us-east-1

jobs:
  lint:
    name: Lint Dockerfile and shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: ShellCheck
        run: |
          shellcheck --version
          shopt -s nullglob globstar
          shellcheck scripts/**/*.sh

      - name: Publish script self-check
        run: |
          ./scripts/push-ecr-public.sh --self-check
          ./scripts/cleanup-ecr-public-sha-tags.sh --self-check
          python3 scripts/check-oci-layout.py --self-check

  test:
    name: Test the image before it is published, and show the test each violation
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image for this runner
        run: docker build -t aws-kubectl:local .

      # Every advertised tool answers, the baked-in kubectl version matches
      # the binary, and the image runs as UID 10001 with a writable HOME.
      - name: Smoke test
        run: ./scripts/smoke-test.sh aws-kubectl:local

      # A test that cannot fail is not a test: each promise is broken in a
      # copy of the Dockerfile, the image rebuilt, and the run fails if the
      # smoke test stays green.
      - name: The smoke test, shown each violation it exists for
        run: python3 tests/plant-violations.py -- bash -c 'docker build -q -t aws-kubectl:plant . >/dev/null && ./scripts/smoke-test.sh aws-kubectl:plant'

  build:
    name: Build multi-arch OCI archive
    runs-on: ubuntu-latest
    # Nothing is published that the test has not passed.
    needs: [lint, test]
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve kubectl version
        id: kube
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved kubectl version: $version"

      - name: Compute build metadata
        id: meta-build
        run: |
          set -euo pipefail
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "vcs_ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          # sha-<commit> is emitted for branch runs (push to main, the weekly
          # schedule, a manual dispatch). The push job leaves the tag alone
          # when ECR Public already has it, so a rebuild cannot move it.
          # kube-<version> is emitted for release tags and treated the same way.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=kube-${{ steps.kube.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=aws-kubectl
            org.opencontainers.image.description=Ubuntu 26.04 image bundling AWS CLI v2, kubectl, jq, envsubst, curl and ca-certificates for CI/CD and local tooling.
            org.opencontainers.image.vendor=heyvaldemar
            org.opencontainers.image.licenses=MIT
            io.heyvaldemar.kubectl.version=${{ steps.kube.outputs.version }}

      - name: Export tag list
        id: tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build OCI archive
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        timeout-minutes: 35
        with:
          context: .
          file: Dockerfile
          # amd64 + arm64 only. See the header comment.
          platforms: linux/amd64,linux/arm64
          # Tags are applied on the push runner. Passing them here makes
          # buildx write one layout entry per tag, which the push rejects.
          outputs: type=oci,dest=${{ runner.temp }}/aws-kubectl.oci.tar
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KUBE_VERSION=${{ steps.kube.outputs.version }}
            VCS_REF=${{ steps.meta-build.outputs.vcs_ref }}
            BUILD_DATE=${{ steps.meta-build.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Check the OCI layout has one multi-arch index
        id: layout
        env:
          ACTION_DIGEST: ${{ steps.build.outputs.digest }}
          OCI_TAR: ${{ runner.temp }}/aws-kubectl.oci.tar
        run: |
          set -euo pipefail
          index="${RUNNER_TEMP}/oci-index.json"
          tar -xOf "$OCI_TAR" index.json > "$index"
          digest=$(python3 scripts/check-oci-layout.py "$index")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Layout digest: ${digest}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.layout.outputs.digest }}
          # This job has no ECR credentials. The attestation stays in GitHub.
          # BuildKit's own SBOM and provenance travel inside the OCI archive
          # and are pushed with the image.
          push-to-registry: false

      - name: Upload OCI archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aws-kubectl-oci
          path: ${{ runner.temp }}/aws-kubectl.oci.tar
          if-no-files-found: error
          retention-days: 1
          # Layer blobs are already compressed; deflating the tar costs time.
          compression-level: 0
          overwrite: true

  push:
    name: Push to ECR Public
    # Literal label, not an expression a pull_request can satisfy by accident.
    # The if below is an allowlist: the job is not queued for any other event,
    # including pull_request, pull_request_target, and runs where this
    # repository is a fork. GitHub evaluates if before assigning a runner.
    runs-on: ecr-public-publisher
    needs: build
    if: >-
      github.event.repository.fork == false &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    permissions:
      contents: read
      # Cosign keyless signing uses the GitHub Actions OIDC token, not AWS.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download OCI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aws-kubectl-oci
          path: oci-image

      - name: Push and sign
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          ECR_REGION: ${{ env.ECR_REGION }}
          OCI_TAR: oci-image/aws-kubectl.oci.tar
          TAGS: ${{ needs.build.outputs.tags }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: ./scripts/push-ecr-public.sh

  scan-trivy:
    name: Scan published image with Trivy
    runs-on: ubuntu-latest
    needs: [build, push]
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    # NO continue-on-error, and the difference is not cosmetic. The action's
    # exit code defaults to 0, so a finding never failed this job; the only
    # thing the flag could hide was a scan that did not finish - a deadline, a
    # registry refusing the pull. When the scan step fails the SARIF upload
    # after it is skipped, so nothing reaches the Security tab either, and the
    # run still said success. The same flag was removed from sixty templates
    # after one of them hid exactly that; this pipeline was not a template, so
    # that rollout never reached it. The image is already published by the time
    # this runs, so a red here changes what is visible, not what is shipped.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy
