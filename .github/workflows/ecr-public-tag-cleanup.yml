name: ECR Public tag cleanup

# Deletes sha-* images older than 90 days from ECR Public.
# Runs on ecr-public-publisher. That runner's pod identity can call
# ecr-public; there are no AWS keys in GitHub secrets.
# A digest is deleted only when every tag on it is sha-<hex>. Deleting by
# digest would otherwise remove latest, edge, or a semver tag that shares it.
#
# Schedule is an hour after the Monday publish. A manual run lists only,
# unless dry_run is set to false.
#
# This workflow has no pull_request trigger. The job if is still an allowlist,
# so adding one later does not schedule the runner. Schedule and manual runs
# must be on main. Only grasshopper-labs/aws-kubectl-docker runs it.
# repository.fork is unusable here: this repository is itself a fork.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list only, no deletion)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: ecr-public-tag-cleanup
  cancel-in-progress: false

permissions:
  contents: read

env:
  ECR_REPOSITORY: aws-kubectl
  ECR_REGION: us-east-1

jobs:
  cleanup:
    name: Delete sha-only images older than 90 days
    runs-on: ecr-public-publisher
    if: >-
      github.repository == 'grasshopper-labs/aws-kubectl-docker' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete stale sha-only images
        env:
          # Scheduled runs have no input and delete. A manual run defaults
          # to listing only.
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: ./scripts/cleanup-ecr-public-sha-tags.sh
